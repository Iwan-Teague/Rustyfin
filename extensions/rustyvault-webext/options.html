<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RustyVault Options</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">RustyVault</p>
        <h1>Extension options</h1>
        <p class="muted">Conservative defaults stay on unless you explicitly change them here.</p>
      </header>

      <section class="panel">
        <label class="field">
          <span>Rustyfin server URL</span>
          <input id="server-url" />
        </label>
        <label class="field">
          <span>Auto-lock minutes</span>
          <input id="auto-lock" type="number" min="1" max="240" />
        </label>
        <label class="field">
          <span>Default match mode</span>
          <select id="match-mode">
            <option value="exact">Exact</option>
            <option value="host">Host</option>
            <option value="base_domain">Base domain</option>
            <option value="never">Never</option>
          </select>
        </label>
        <label class="field">
          <span>Excluded domains</span>
          <textarea id="excluded-domains" rows="6"></textarea>
        </label>
        <label class="field">
          <input id="warn-http" type="checkbox" />
          <span>Warn before HTTP fill</span>
        </label>
        <label class="field">
          <input id="allow-http-fill" type="checkbox" />
          <span>Allow manual fill on HTTP pages</span>
        </label>
        <label class="field">
          <input id="warn-iframe" type="checkbox" />
          <span>Warn before untrusted iframe fill</span>
        </label>
        <label class="field">
          <input id="page-load-autofill" type="checkbox" />
          <span>Allow page-load autofill (not recommended)</span>
        </label>
        <button id="save-options" class="btn btn-primary">Save options</button>
      </section>

      <section class="panel">
        <p id="status" class="muted">Loading settings...</p>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
