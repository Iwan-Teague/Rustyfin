[package]
name = "rustfin-transcription-agent"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rustfin-transcription-agent"
path = "src/main.rs"

[dependencies]
rustfin-core = { path = "../core" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
whisper-rs = "0.12"
num_cpus = "1.16"
glob = "0.3"

[features]
default = []
gpu-opencl = ["dep:rustfin-transcription-opencl-link"]
gpu-cuda = ["dep:rustfin-transcription-cuda-link"]
gpu-hip = ["dep:rustfin-transcription-hip-link"]
gpu-all = ["gpu-opencl", "gpu-cuda", "gpu-hip"]

[target.'cfg(target_os = "linux")'.dependencies]
rustfin-transcription-opencl-link = { path = "../transcription-opencl-link", optional = true }
rustfin-transcription-cuda-link = { path = "../transcription-cuda-link", optional = true }
rustfin-transcription-hip-link = { path = "../transcription-hip-link", optional = true }
