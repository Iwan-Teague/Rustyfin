[package]
name = "rustfin-ai-agent"
version.workspace = true
edition.workspace = true

[features]
default = []
cuda = ["dep:rustfin-ai-agent-cuda-link"]
rocm = ["dep:rustfin-ai-agent-rocm-link"]
vulkan = ["dep:rustfin-ai-agent-vulkan-link"]
cpu = []

[dependencies]
llama-cpp-2 = { version = "0.1.143", default-features = false }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
encoding_rs = "0.8"
tracing = { workspace = true }
thiserror = { workspace = true }
async-stream = "0.3"
sha2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustfin-ai-agent-cuda-link = { path = "../ai-agent-cuda-link", optional = true }
rustfin-ai-agent-rocm-link = { path = "../ai-agent-rocm-link", optional = true }
rustfin-ai-agent-vulkan-link = { path = "../ai-agent-vulkan-link", optional = true }
