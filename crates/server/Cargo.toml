[package]
name = "rustfin-server"
version.workspace = true
edition.workspace = true

[features]
default = ["rustyvault", "ai-cpu"]
rustyvault = ["dep:rustyvault"]
ai-cpu = []
ai-cuda = ["rustfin-ai-agent/cuda"]
ai-rocm = ["rustfin-ai-agent/rocm"]
ai-vulkan = ["rustfin-ai-agent/vulkan"]

[[bin]]
name = "rustfin-server"
path = "src/main.rs"

[dependencies]
rustfin-ai-agent = { path = "../ai-agent", default-features = false }
rustfin-core = { path = "../core" }
rustfin-db = { path = "../db" }
rustfin-metadata = { path = "../metadata" }
rustyvault = { path = "../rustyvault", optional = true }
rustfin-scanner = { path = "../scanner" }
rustfin-servers-host = { path = "../servers-host" }
rustfin-transcoder = { path = "../transcoder" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
tokio-util = { workspace = true }
zip = { workspace = true }
futures = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
chess = "3.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
axum-test = { version = "18", features = ["ws"] }
rustfin-transcoder = { path = "../transcoder" }
