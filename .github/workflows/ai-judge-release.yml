name: ai-judge-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege (AQ-97): read-only token; no job publishes or writes to the repo.
permissions:
  contents: read

jobs:
  ai-judge-release:
    name: ai-judge-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ffmpeg \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head 6bed076 (a moving branch pinned to a commit; verified against the upstream ref 2026-09-22)

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run AI judge release gate
        run: bash scripts/ci/judge_gates.sh --mode release --artifacts-dir .tmp/gates/ci-release

      - name: Upload AI judge release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-judge-release-artifacts
          path: .tmp/gates/ci-release
          if-no-files-found: error
