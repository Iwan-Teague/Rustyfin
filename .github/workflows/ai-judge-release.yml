name: ai-judge-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ai-judge-release:
    name: ai-judge-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ffmpeg \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run AI judge release gate
        run: bash scripts/ci/judge_gates.sh --mode release --artifacts-dir .tmp/gates/ci-release

      - name: Upload AI judge release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-judge-release-artifacts
          path: .tmp/gates/ci-release
          if-no-files-found: error
