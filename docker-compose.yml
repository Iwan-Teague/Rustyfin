services:
  # Backend API server
  rustfin:
    build: .
    ports:
      - "${RUSTFIN_BACKEND_PORT:-8096}:8096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rustfin-config:/config
      - rustfin-cache:/cache
      - rustfin-transcode:/transcode
      - ${RUSTFIN_MEDIA_PATH:-./media}:${RUSTFIN_MEDIA_CONTAINER_ROOT:-/media}:ro
    environment:
      - RUSTFIN_ADMIN_PASSWORD=changeme
      - RUST_LOG=info
      - RUSTFIN_TMDB_KEY=${RUSTFIN_TMDB_KEY:-}
      - RUSTFIN_TMDB_AGENT_URL=${RUSTFIN_TMDB_AGENT_URL:-http://rustfin-tmdb-agent:8100}
      - RUSTFIN_TMDB_AGENT_TOKEN=${RUSTFIN_TMDB_AGENT_TOKEN:-}
      - RUSTFIN_YOUTUBE_COOKIE=${RUSTFIN_YOUTUBE_COOKIE:-}
      - RUSTFIN_DIRECTORY_PICKER_HELPER_URL=${RUSTFIN_DIRECTORY_PICKER_HELPER_URL:-http://host.docker.internal:43110/pick}
      - RUSTFIN_MEDIA_HOST_PATH=${RUSTFIN_MEDIA_PATH:-./media}
      - RUSTFIN_MEDIA_CONTAINER_ROOT=${RUSTFIN_MEDIA_CONTAINER_ROOT:-/media}
      - RUSTFIN_WS_ALLOWED_ORIGINS=${RUSTFIN_WS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  rustfin-tmdb-agent:
    build:
      context: .
      dockerfile: crates/tmdb-agent/Dockerfile
    environment:
      - RUST_LOG=info
      - RUSTFIN_TMDB_AGENT_BIND=0.0.0.0:8100
      - RUSTFIN_DB=/config/rustfin.db
      - RUSTFIN_CACHE_DIR=/cache
      - RUSTFIN_TMDB_KEY=${RUSTFIN_TMDB_KEY:-}
      - RUSTFIN_TMDB_AGENT_TOKEN=${RUSTFIN_TMDB_AGENT_TOKEN:-}
    volumes:
      - rustfin-config:/config
      - rustfin-cache:/cache
    depends_on:
      rustfin:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Frontend UI
  rustfin-ui:
    build: ./ui
    environment:
      - NODE_ENV=production
      - RUSTYFIN_BROWSER_BACKEND_ORIGIN=${RUSTYFIN_BROWSER_BACKEND_ORIGIN:-http://localhost:8096}
    depends_on:
      rustfin:
        condition: service_healthy
      rustfin-calendar:
        condition: service_started
    restart: unless-stopped

  rustfin-calendar:
    build:
      context: .
      dockerfile: crates/calendar/Dockerfile
    environment:
      - RUST_LOG=info
      - RUSTFIN_CALENDAR_BIND=0.0.0.0:8099
      - RUSTFIN_DB=/config/rustfin.db
      - RUSTFIN_AUTH_BASE_URL=http://rustfin:8096
    volumes:
      - rustfin-config:/config
    depends_on:
      rustfin:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # HTTPS edge proxy for browser clients (required for LAN microphone permissions).
  rustfin-edge:
    image: caddy:2
    ports:
      - "${RUSTFIN_UI_PORT:-3000}:443"
    environment:
      - RUSTFIN_PUBLIC_HOST=${RUSTFIN_PUBLIC_HOST:-localhost}
    volumes:
      - ./scripts/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${RUSTFIN_EDGE_TLS_CERT:-./.tmp/edge-tls/tls.crt}:/etc/caddy/certs/tls.crt:ro
      - ${RUSTFIN_EDGE_TLS_KEY:-./.tmp/edge-tls/tls.key}:/etc/caddy/certs/tls.key:ro
      - rustfin-caddy-data:/data
      - rustfin-caddy-config:/config
    depends_on:
      rustfin:
        condition: service_healthy
      rustfin-calendar:
        condition: service_healthy
      rustfin-ui:
        condition: service_started
    restart: unless-stopped

volumes:
  rustfin-config:
  rustfin-cache:
  rustfin-transcode:
  rustfin-caddy-data:
  rustfin-caddy-config:
