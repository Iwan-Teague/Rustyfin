services:
  postgres:
    image: postgres:16-bookworm
    environment:
      - POSTGRES_USER=${RUSTFIN_PG_USER:-rustfin}
      - POSTGRES_PASSWORD=${RUSTFIN_PG_PASSWORD:-rustfin}
      - POSTGRES_DB=${RUSTFIN_PG_DB:-rustfin}
    volumes:
      - rustfin-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUSTFIN_PG_USER:-rustfin} -d ${RUSTFIN_PG_DB:-rustfin}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Backend API server
  rustfin:
    build:
      context: .
      dockerfile: ${RUSTFIN_SERVER_DOCKERFILE:-Dockerfile}
      args:
        RUST_BUILD_PROFILE: ${RUSTFIN_RUST_BUILD_PROFILE:-dev}
        NATIVE_BIN_DIR: ${RUSTFIN_NATIVE_BIN_DIR:-.native-bins}
    ports:
      - "${RUSTFIN_BACKEND_PORT:-8096}:8096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rustfin-config:/config
      - rustfin-cache:/cache
      - rustfin-transcode:/transcode
      - ${RUSTFIN_MEDIA_PATH:-./media}:${RUSTFIN_MEDIA_CONTAINER_ROOT:-/media}:ro
    environment:
      - RUSTFIN_ADMIN_PASSWORD=changeme
      - RUST_LOG=info
      - RUSTFIN_TMDB_KEY=${RUSTFIN_TMDB_KEY:-}
      - RUSTFIN_TMDB_AGENT_URL=${RUSTFIN_TMDB_AGENT_URL:-http://rustfin-tmdb-agent:8100}
      - RUSTFIN_TMDB_AGENT_TOKEN=${RUSTFIN_TMDB_AGENT_TOKEN:-}
      - RUSTFIN_YOUTUBE_AGENT_URL=${RUSTFIN_YOUTUBE_AGENT_URL:-http://rustfin-youtube-agent:8101}
      - RUSTFIN_YOUTUBE_AGENT_TOKEN=${RUSTFIN_YOUTUBE_AGENT_TOKEN:-}
      - RUSTFIN_TRANSCRIPTION_AGENT_URL=${RUSTFIN_TRANSCRIPTION_AGENT_URL:-http://rustfin-transcription-agent:8102}
      - RUSTFIN_TRANSCRIPTION_AGENT_TOKEN=${RUSTFIN_TRANSCRIPTION_AGENT_TOKEN:-}
      - RUSTFIN_DATABASE_URL=${RUSTFIN_DATABASE_URL:-postgresql://rustfin:rustfin@postgres:5432/rustfin}
      - RUSTFIN_YOUTUBE_COOKIE=${RUSTFIN_YOUTUBE_COOKIE:-}
      - RUSTFIN_DIRECTORY_PICKER_HELPER_URL=${RUSTFIN_DIRECTORY_PICKER_HELPER_URL:-http://host.docker.internal:43110/pick}
      - RUSTFIN_MEDIA_HOST_PATH=${RUSTFIN_MEDIA_PATH:-./media}
      - RUSTFIN_MEDIA_CONTAINER_ROOT=${RUSTFIN_MEDIA_CONTAINER_ROOT:-/media}
      - RUSTFIN_CACHE_DIR=/cache
      - RUSTFIN_WS_ALLOWED_ORIGINS=${RUSTFIN_WS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - RUSTFIN_RUN_MIGRATIONS=${RUSTFIN_RUN_MIGRATIONS:-true}
      - RUSTFIN_TRANSCODER_HW_ACCEL=${RUSTFIN_TRANSCODER_HW_ACCEL:-auto}
      - RUSTFIN_TRANSCODER_REQUIRE_HW_ACCEL=${RUSTFIN_TRANSCODER_REQUIRE_HW_ACCEL:-0}
    depends_on:
      postgres:
        condition: service_healthy
      rustfin-youtube-agent:
        condition: service_started
      rustfin-transcription-agent:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  rustfin-tmdb-agent:
    build:
      context: .
      dockerfile: ${RUSTFIN_TMDB_AGENT_DOCKERFILE:-crates/tmdb-agent/Dockerfile}
      args:
        RUST_BUILD_PROFILE: ${RUSTFIN_RUST_BUILD_PROFILE:-dev}
        NATIVE_BIN_DIR: ${RUSTFIN_NATIVE_BIN_DIR:-.native-bins}
    environment:
      - RUST_LOG=info
      - RUSTFIN_DATABASE_URL=${RUSTFIN_DATABASE_URL:-postgresql://rustfin:rustfin@postgres:5432/rustfin}
      - RUSTFIN_TMDB_AGENT_BIND=0.0.0.0:8100
      - RUSTFIN_CACHE_DIR=/cache
      - RUSTFIN_TMDB_KEY=${RUSTFIN_TMDB_KEY:-}
      - RUSTFIN_TMDB_AGENT_TOKEN=${RUSTFIN_TMDB_AGENT_TOKEN:-}
      - RUSTFIN_RUN_MIGRATIONS=${RUSTFIN_TMDB_AGENT_RUN_MIGRATIONS:-false}
    volumes:
      - rustfin-config:/config
      - rustfin-cache:/cache
    depends_on:
      rustfin:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  rustfin-youtube-agent:
    build:
      context: .
      dockerfile: ${RUSTFIN_YOUTUBE_AGENT_DOCKERFILE:-crates/youtube-agent/Dockerfile}
      args:
        RUST_BUILD_PROFILE: ${RUSTFIN_RUST_BUILD_PROFILE:-dev}
        NATIVE_BIN_DIR: ${RUSTFIN_NATIVE_BIN_DIR:-.native-bins}
    environment:
      - RUST_LOG=info
      - RUSTFIN_YOUTUBE_AGENT_BIND=0.0.0.0:8101
      - RUSTFIN_CACHE_DIR=/cache
      - RUSTFIN_FFMPEG_PATH=ffmpeg
      - RUSTFIN_FFPROBE_PATH=ffprobe
      - RUSTFIN_YOUTUBE_COOKIE=${RUSTFIN_YOUTUBE_COOKIE:-}
      - RUSTFIN_YOUTUBE_COOKIE_FILE=${RUSTFIN_YOUTUBE_COOKIE_FILE:-}
      - RUSTFIN_YOUTUBE_AGENT_TOKEN=${RUSTFIN_YOUTUBE_AGENT_TOKEN:-}
    volumes:
      - rustfin-cache:/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  rustfin-transcription-agent:
    build:
      context: .
      dockerfile: ${RUSTFIN_TRANSCRIPTION_AGENT_DOCKERFILE:-crates/transcription-agent/Dockerfile}
      args:
        RUST_BUILD_PROFILE: ${RUSTFIN_RUST_BUILD_PROFILE:-dev}
        NATIVE_BIN_DIR: ${RUSTFIN_NATIVE_BIN_DIR:-.native-bins}
    environment:
      - RUST_LOG=info
      - RUSTFIN_TRANSCRIPTION_AGENT_BIND=0.0.0.0:8102
      - RUSTFIN_CACHE_DIR=/cache
      - RUSTFIN_TRANSCRIPTION_AGENT_TOKEN=${RUSTFIN_TRANSCRIPTION_AGENT_TOKEN:-}
      - RUSTFIN_WHISPER_MODEL_PATH=${RUSTFIN_WHISPER_MODEL_PATH:-/cache/whisper/ggml-base.en.bin}
      - RUSTFIN_WHISPER_MODEL_URL=${RUSTFIN_WHISPER_MODEL_URL:-https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin}
    volumes:
      - rustfin-cache:/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Frontend UI
  rustfin-ui:
    build: ./ui
    environment:
      - NODE_ENV=production
      - RUSTYFIN_BROWSER_BACKEND_ORIGIN=${RUSTYFIN_BROWSER_BACKEND_ORIGIN:-http://localhost:8096}
    depends_on:
      rustfin:
        condition: service_healthy
      rustfin-calendar:
        condition: service_started
    restart: unless-stopped

  rustfin-calendar:
    build:
      context: .
      dockerfile: ${RUSTFIN_CALENDAR_DOCKERFILE:-crates/calendar/Dockerfile}
      args:
        RUST_BUILD_PROFILE: ${RUSTFIN_RUST_BUILD_PROFILE:-dev}
        NATIVE_BIN_DIR: ${RUSTFIN_NATIVE_BIN_DIR:-.native-bins}
    environment:
      - RUST_LOG=info
      - RUSTFIN_DATABASE_URL=${RUSTFIN_DATABASE_URL:-postgresql://rustfin:rustfin@postgres:5432/rustfin}
      - RUSTFIN_CALENDAR_BIND=0.0.0.0:8099
      - RUSTFIN_AUTH_BASE_URL=http://rustfin:8096
      - RUSTFIN_RUN_MIGRATIONS=${RUSTFIN_CALENDAR_RUN_MIGRATIONS:-false}
    volumes:
      - rustfin-config:/config
    depends_on:
      rustfin:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # HTTPS edge proxy for browser clients (required for LAN microphone permissions).
  rustfin-edge:
    image: caddy:2
    ports:
      - "${RUSTFIN_UI_PORT:-3000}:443"
    environment:
      - RUSTFIN_PUBLIC_HOST=${RUSTFIN_PUBLIC_HOST:-localhost}
    volumes:
      - ./scripts/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${RUSTFIN_EDGE_TLS_CERT:-./.tmp/edge-tls/tls.crt}:/etc/caddy/certs/tls.crt:ro
      - ${RUSTFIN_EDGE_TLS_KEY:-./.tmp/edge-tls/tls.key}:/etc/caddy/certs/tls.key:ro
      - rustfin-caddy-data:/data
      - rustfin-caddy-config:/config
    depends_on:
      rustfin:
        condition: service_healthy
      rustfin-calendar:
        condition: service_healthy
      rustfin-ui:
        condition: service_started
    restart: unless-stopped

volumes:
  rustfin-config:
  rustfin-cache:
  rustfin-transcode:
  rustfin-postgres-data:
  rustfin-caddy-data:
  rustfin-caddy-config:
