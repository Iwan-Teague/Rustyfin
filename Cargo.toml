[workspace]
resolver = "2"
members = [
    "crates/ai-evals",
    "crates/ai-agent",
    "crates/calendar",
    "crates/core",
    "crates/db",
    "crates/installer",
    "crates/metadata",
    "crates/rustyvault",
    "crates/scanner",
    "crates/servers-agent",
    "crates/servers-host",
    "crates/tmdb-agent",
    "crates/transcription-agent",
    "crates/youtube-agent",
    "crates/transcoder",
    "crates/server",
]
exclude = [
    "crates/ai-agent-cuda-link",
    "crates/ai-agent-rocm-link",
    "crates/ai-agent-vulkan-link",
    "crates/transcription-cuda-link",
    "crates/transcription-hip-link",
    "crates/transcription-opencl-link",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }

# Web framework
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database (PostgreSQL-only)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
jsonwebtoken = "9"

# Crypto
sha2 = "0.10"
subtle = "2"
rand = "0.8"
hex = "0.4"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
